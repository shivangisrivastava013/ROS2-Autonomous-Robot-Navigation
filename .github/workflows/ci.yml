name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linting
        run: python -m ruff check .

      - name: Run Black Code Formatting Check
        run: python -m black --check .

      - name: Run Pytest Suite
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ros2-autonomous-robot-navigation:latest .

  ros2-colcon-build:
    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS2 Build Tools
        run: |
          apt-get update && apt-get install -y python3-colcon-common-extensions python3-rosdep
          rosdep update || true

      - name: Build Package with Colcon
        run: |
          mkdir -p /tmp/ros2_ws/src
          cp -r . /tmp/ros2_ws/src/robot_nav
          cd /tmp/ros2_ws
          . /opt/ros/humble/setup.sh
          colcon build --packages-select robot_nav
