services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: assignment3-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: semantic_map
    ports:
      - "5432:5432"
    volumes:
      - pgdata_assignment3:/var/lib/postgresql/data

volumes:
  pgdata_assignment3: